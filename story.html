<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="屁屁小屋">
<title>屁屁小屋 · 序章</title>
  <link rel="preload" as="image" href="assets/foyer-background-v1-optimized.jpg">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { position:relative; overflow:hidden; background: #1d1923; font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; }
    .scene { width: 1536px; height: 1024px; position: absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(var(--fit, 1)); transform-origin:center; overflow: hidden; background: url("assets/foyer-background-v1-optimized.jpg") center / 100% 100% no-repeat; }
    .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(0deg, #20142126, transparent 45%); }
    .character { width: 220px; height: 220px; position: absolute; image-rendering: pixelated; background-repeat: no-repeat; background-size: 400% 500%; background-position:0% 0%; filter: drop-shadow(0 9px 5px #55342688); z-index: 3; transition:left .78s cubic-bezier(.22,.61,.36,1), top .78s cubic-bezier(.22,.61,.36,1), opacity .18s ease; }
    .girl { left:550px; top:520px; background-image: url("assets/character-sprites-small.webp"); animation: breathe 3.6s ease-in-out infinite; }
    .boy { animation: breathe 4.2s ease-in-out infinite; animation-delay: -.9s; }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(1px) scale(1.006, .994); }
    }
    .boy { left:790px; top:520px; background-image: url("assets/male-sprites-v1-small.webp"); }
    .arrival .girl, .explore .girl, .dialogue .girl { left:var(--girl-x, 282px); top:var(--girl-y, 686px); }
    .arrival .girl, .explore .girl { transition:none; }
    .arrival .boy, .explore .boy, .dialogue .boy { left:790px; top:520px; }
    .arrival .boy, .explore .boy { cursor:pointer; }
    .together .girl { left:550px; top:520px; }
    .together .boy { left:790px; top:520px; }
    .together .girl { left: 640px; top: 520px; }
    .together .boy { left: 745px; top: 520px; }
    .scene-mark { position:absolute; left: 38px; top: 26px; z-index: 7; padding: 10px 16px; color: #fff6e9; border: 1px solid #ffebb386; border-radius: 999px; font-size: 17px; letter-spacing: .08em; background: #473142bd; box-shadow: 0 4px 20px #301c3099; }
    .arrival .scene-mark::after { content: " · 等待"; }
    .dialogue .scene-mark::after { content: " · 对话中"; }
    .together .scene-mark::after { content: " · 对话结束"; }
    .music { position:absolute; right: 38px; top: 26px; z-index:7; background: #473142bd; border:1px solid #ffebb386; color:#fff6e9; border-radius:12px; padding: 8px 15px; font-size:18px; cursor:pointer; }
    .arrival-note { position:absolute; z-index:6; left:50%; bottom:46px; transform:translateX(-50%); white-space:nowrap; color:#fff8ea; background:#3e2b3dd9; border:1px solid #f6d8b6aa; padding:14px 23px; border-radius:999px; font-size:18px; box-shadow:0 8px 30px #23131a88; }
    .explore-note { display:none; position:absolute; z-index:6; left:50%; bottom:46px; transform:translateX(-50%); white-space:nowrap; color:#fff8ea; background:#3e2b3dd9; border:1px solid #f6d8b6aa; padding:14px 23px; border-radius:999px; font-size:18px; box-shadow:0 8px 30px #23131a88; }
    .explore .explore-note { display:block; }
    .interact-panel { position:absolute; z-index:9; left:730px; top:420px; display:flex; gap:10px; padding:11px; border-radius:17px; background:#fff1dcf2; border:3px solid #bf8f98; box-shadow:0 8px 22px #3d27368a; }
    .interact-panel strong { align-self:center; color:#765267; font-size:17px; white-space:nowrap; margin:0 5px; }
    [hidden] { display:none!important; }
    .boy-cue { position:absolute; left:900px; top:535px; z-index:5; color:#6a4d54; background:#fff0d7; border:3px solid #b48585; padding:12px 20px; border-radius:18px; box-shadow:0 7px 23px #3d263d55; font-size:19px; }
    .boy-cue:after { content:""; position:absolute; left:30px; bottom:-14px; border-width:13px 12px 0; border-style:solid; border-color:#fff0d7 transparent transparent; }
    .dialogue-card { display:none; position:fixed; z-index:40; left:50%; bottom:max(16px, 2vh); transform:translateX(-50%); width:min(1200px, calc(100vw - 36px)); max-height:min(62vh, 520px); overflow-y:auto; border:5px double #b7838b; border-radius:14px; padding:18px 28px 14px; background:#fff1da; color:#5b3e4b; box-shadow:0 16px 50px #2a1825a8; }
    .scene.dialogue ~ .dialogue-card, .scene.together ~ .dialogue-card { display:block; }
    .card-top { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:10px; }
    .speaker { display:inline-block; background:#9d667e; border-radius:999px; color:#fff8ed; font-size:16px; font-weight:700; padding:6px 16px; }
    .page { color:#9d7b80; font-size:15px; }
    .dialogue-line { font-size:24px; line-height:1.5; letter-spacing:.03em; margin:0; }
    .dialogue-line.line-appear { animation: line-appear .26s ease-out both; }
    @keyframes line-appear { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .sample { color:#9d8082; font-size:14px; margin:4px 0 0; }
    .card-bottom { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-top:8px; flex-wrap:wrap; }
    .dots { color:#c68da6; font-size:20px; letter-spacing:5px; }
    .buttons { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .button { display:inline-block; background:#ad7086; color:#fffaf1; border:0; border-radius:999px; padding:10px 24px; font-size:16px; font-weight:700; box-shadow:0 4px 0 #7c4d60; text-decoration:none; cursor:pointer; }
    .button.pale { background:#f8e0df; color:#835b6b; box-shadow:0 4px 0 #d1aeb3; }
    .scene.together ~ .dialogue-card .dialogue-line { font-size:24px; }
    .scene.together ~ .dialogue-card { animation:card-appear-fixed .32s ease-out both; }
    .scene.dialogue ~ .dialogue-card .together-only,
    .scene.together ~ .dialogue-card .dialogue-only,
    .scene.arrival ~ .dialogue-card .together-only { display:none; }
    .heart { display:none; position:absolute; z-index:7; left:746px; top:486px; color:#fa88a6; font-size:63px; text-shadow:0 3px 5px #8c5470aa; }
    .together .heart { display:block; }
    .action-caption { display:none; }
    .action-canvas { position:absolute; z-index:6; left:52.5%; top:470px; width:300px; height:310px; opacity:0; pointer-events:none; transform:translate3d(-50%,0,0); transform-origin:50% 84%; transition:opacity .12s linear; will-change:opacity,transform; }
    .action-pair .action-canvas { opacity:1; }
    .action-pair .character { opacity:0; }
    .action-approach .character { transition:none; will-change:transform; }
    .action-release .character { transition:opacity .12s linear; will-change:transform; }
    .action-contact::after { content:'♥'; position:absolute; z-index:7; left:52.5%; top:482px; color:#ff8eaf; font-size:26px; text-shadow:0 2px 5px #9f6285; animation:heart-rise 1s ease-out both; }
    .action-approach .boy-cue, .action-approach .arrival-note { display:none; }
    .arrival-motion .girl { left:550px; top:520px; animation:walk-right .52s steps(3,end) infinite; }
    .arrival-motion .boy { left:790px; top:520px; }
    .arrival-motion .boy-cue, .arrival-motion .arrival-note { opacity:0; }
    .leaving .girl { left:1030px; top:500px; animation:walk-right .52s steps(3,end) infinite; }
    .leaving .boy { left:1170px; top:420px; animation:walk-right .52s steps(3,end) infinite; }
    .leaving .boy-cue, .leaving .arrival-note, .leaving .explore-note { display:none; }
    .together .dialogue-card { animation:card-appear .32s ease-out both; }
    @keyframes walk-right { from{background-position:0% 75%} to{background-position:100% 75%} }
    @keyframes walk-left { from{background-position:0% 50%} to{background-position:100% 50%} }
    @keyframes heart-rise { 0%{opacity:0;transform:translateY(18px) scale(.7)} 35%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-42px) scale(1.3)} }
    @keyframes card-appear { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .action-pair.hug .scene-mark::after { content:" · 拥抱"; }
    .action-pair.kiss .scene-mark::after { content:" · 亲吻"; }
    .explore .scene-mark::after { content:" · 自由走动"; }
    .leaving .scene-mark::after { content:" · 去下一间"; }
    .action-approach .scene-mark::after { content:" · 走近"; }
    .action-pair.action-contact .action-caption { position:absolute; z-index:8; left:50%; bottom:44px; transform:translateX(-50%); padding:12px 25px; white-space:nowrap; background:#fff0d9; color:#6c4b59; border:3px solid #b7848e; border-radius:999px; box-shadow:0 9px 25px #38203388; font-size:20px; }
    .action-pair.action-contact.hug .hug-caption,.action-pair.action-contact.kiss .kiss-caption { display:block; }
    .action-next { display:none; position:absolute; z-index:9; bottom:42px; right:32px; gap:12px; }
    .arrival .boy-cue, .arrival .arrival-note { cursor:pointer; }
    .arrival .dialogue-card, .dialogue .arrival-note, .together .arrival-note, .explore .arrival-note, .dialogue .boy-cue, .together .boy-cue { display:none; }
    .action-approach .boy-cue,.action-pair .boy-cue,.action-release .boy-cue,.action-pair .arrival-note,.action-release .arrival-note { display:none; }
    .action-approach .explore-note,.action-pair .explore-note,.action-release .explore-note { display:none; }
    .together .dialogue-only, .dialogue .together-only, .arrival .together-only { display:none; }
    [data-compact="true"] .dialogue-card { width: calc(100vw - 20px); bottom: 10px; padding: 14px 14px 10px; max-height: 56vh; border-width: 4px; }
    [data-compact="true"] .card-top { margin-bottom: 7px; gap: 10px; }
    [data-compact="true"] .speaker { font-size: 12px; padding: 4px 11px; }
    [data-compact="true"] .page { font-size: 11px; }
    [data-compact="true"] .dialogue-line, [data-compact="true"] .scene.together ~ .dialogue-card .dialogue-line { font-size: 15px; line-height: 1.6; letter-spacing: .01em; }
    [data-compact="true"] .sample { font-size: 11px; margin-top: 3px; }
    [data-compact="true"] .button { font-size: 13px; padding: 8px 15px; }
    [data-compact="true"] .card-bottom { margin-top: 6px; }
    [data-compact="true"] .scene.dialogue, [data-compact="true"] .scene.together { top: 34%; }
  </style>
</head>
<body>
  <main id="scene" class="scene arrival" aria-label="屁屁小屋序章">
    <div class="shade"></div>
    <a class="scene-mark" href="index.html" style="text-decoration:none">序章</a>
    <button class="music" id="foyerSoundButton" aria-label="开启背景音乐" aria-pressed="false">♪ 音乐</button>
    <div class="character girl"></div>
    <div class="character boy"></div>
    <canvas class="action-canvas" width="450" height="465" aria-hidden="true"></canvas>
    <div class="action-caption hug-caption">轻轻抱住 ♡</div>
    <div class="action-caption kiss-caption">亲亲脸颊 ♡</div>
    <div class="boy-cue">咳咳…测试麦克风</div>
    <div class="arrival-note">点击地板自由走动 · 靠近男生开始对话</div>
    <div class="explore-note">继续自由走动 · 走近他才会出现互动</div>
    <div class="interact-panel" id="interactPanel" hidden><strong>怎么回应他？</strong><button class="button pale" data-scene="hug">抱抱他</button><button class="button pale" data-scene="kiss">亲一下</button><button class="button" data-go-room>让他带路 →</button></div>
    <div class="heart">♥</div>
    <div class="action-next"><button class="button pale" data-scene="together">返回互动选择</button><a class="button" href="world.html">进屋去 →</a></div>
  </main>
  <!-- 对话卡放在缩放场景外面：手机上才不会被一起缩小成 7px 的字 -->
  <section class="dialogue-card" aria-label="对话">
    <div class="dialogue-only">
      <div class="card-top"><span class="speaker">他</span><span class="page" id="dialoguePage">1 / 5</span></div>
      <p class="dialogue-line" id="dialogueLine">咳咳，测试麦克风……那个，屁屁，看得到吗？这是我花了好几个晚上做出来的，别嫌弃页面简陋。</p>
      <div class="card-bottom"><span class="sample">点一下换下一句</span><div class="buttons"><button class="button" id="dialogueNext" data-next-dialogue>下一句 →</button></div></div>
    </div>
    <div class="together-only">
      <div class="card-top"><span class="speaker">他</span><span class="page">留一个小小的悬念 ♡</span></div>
      <p class="dialogue-line">今天是你生日。去随便逛逛吧，我在阳光下，找到了你.......</p>
      <div class="card-bottom"><span class="sample">还想重看动作，可以点右边</span><div class="buttons"><button class="button pale" data-scene="hug">再抱抱</button><button class="button pale" data-scene="kiss">再亲一下</button><a class="button" href="world.html">进屋去 →</a></div></div>
    </div>
  </section>
  <script>
    const scene = document.querySelector('#scene');
    const girl = document.querySelector('.girl');
    const boy = document.querySelector('.boy');
    const interactPanel = document.querySelector('#interactPanel');
    const actionCanvas = document.querySelector('.action-canvas');
    const actionContext = actionCanvas.getContext('2d');
    const frameWidth = actionCanvas.width;
    const frameHeight = actionCanvas.height;
    const musicButton = document.querySelector('#foyerSoundButton');
    let soundOn = false;
    let audioContext;
    let musicTimer;
    let musicStep = 0;
    let nextBeatAt = 0;
    const beatSeconds = 60 / 88;
    const chords = [[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];
    const melody = [392,440,392,329.63,329.63,392,440,392,349.23,392,440,523.25,493.88,440,392,329.63];
    const pairPaths = {
      hug:['assets/hug-approach-v1-small.png','assets/hug-middle-v2-small.png','assets/hug-late-v2-small.png','assets/hug-pose-v1-small.png'],
      kiss:['assets/kiss-approach-v1-small.png','assets/kiss-middle-v2-small.png','assets/kiss-late-v2-small.png','assets/cheek-kiss-pose-v1-small.png']
    };
    const pairFrames = {hug:[],kiss:[]};
    const pairReady = {};
    function ensurePairFrames(kind) {
      return pairReady[kind] ||= Promise.all(pairPaths[kind].map(async (path,index) => {
        const image = new Image();
        image.src = path;
        await image.decode();
        const frame = document.createElement('canvas');
        frame.width = frameWidth;
        frame.height = frameHeight;
        const y = kind === 'kiss' ? frameWidth * 56 / 600 : 0;
        frame.getContext('2d').drawImage(image,0,y,frameWidth,frameWidth * image.naturalHeight / image.naturalWidth);
        pairFrames[kind][index] = frame;
      }));
    }
    const validScenes = new Set(['arrival', 'dialogue', 'explore', 'together']);
    const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const ease = value => value * value * (3 - 2 * value);
    const animate = (duration, update) => new Promise(resolve => {
      let started;
      function frame(now) {
        if (started === undefined) started = now;
        const progress = Math.min(1,(now-started)/duration);
        update(progress,now);
        if (progress < 1) requestAnimationFrame(frame);
        else resolve();
      }
      requestAnimationFrame(frame);
    });
    function musicNote(freq,at,duration,volume,waveform='sine') {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.type = waveform;
      oscillator.frequency.setValueAtTime(freq,at);
      gain.gain.setValueAtTime(.0001,at);
      gain.gain.exponentialRampToValueAtTime(volume,at+.035);
      gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(at);
      oscillator.stop(at+duration+.02);
    }
    function scheduleMusic() {
      while (soundOn && nextBeatAt < audioContext.currentTime+.45) {
        const beat = musicStep%16;
        if (beat%4===0) {
          const chord=chords[beat/4];
          chord.forEach(freq=>musicNote(freq,nextBeatAt,beatSeconds*3.7,.012));
          musicNote(chord[0]/2,nextBeatAt,beatSeconds*2.5,.018,'triangle');
        }
        musicNote(melody[beat],nextBeatAt,beatSeconds*.82,.028,'triangle');
        musicStep++;
        nextBeatAt+=beatSeconds;
      }
    }
    function updateMusicButton() {
      musicButton.textContent = soundOn ? '♫ 音乐' : '♪ 音乐';
      musicButton.setAttribute('aria-pressed',String(soundOn));
      musicButton.setAttribute('aria-label',soundOn ? '关闭背景音乐' : '开启背景音乐');
    }
    function enableMusic() {
      if (soundOn) return;
      try {
        audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
        soundOn = true;
        updateMusicButton();
        audioContext.resume().then(() => {
          if (!soundOn) return;
          musicStep = 0;
          nextBeatAt = audioContext.currentTime+.06;
          scheduleMusic();
          musicTimer = setInterval(scheduleMusic,250);
        }).catch(() => {soundOn=false;updateMusicButton();});
      } catch (_) {soundOn=false;updateMusicButton();}
    }
    function disableMusic() {
      soundOn=false;
      clearInterval(musicTimer);
      musicTimer=null;
      audioContext?.suspend();
      updateMusicButton();
    }
    const directions = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], W:[0,-1], s:[0,1], S:[0,1], a:[-1,0], A:[-1,0], d:[1,0], D:[1,0] };
    const heldKeys = new Set();
    let girlPos = { x:282, y:686 };
    let walkTarget = null;
    let lastFrame = performance.now();
    let walkClock = 0;
    let busy = false;
    function fitScene() {
      // visualViewport is the size actually on screen: on phones innerWidth can be
      // inflated by shrink-to-fit, which used to leave the room cropped.
      const vw = window.visualViewport?.width || innerWidth;
      const vh = window.visualViewport?.height || innerHeight;
      document.documentElement.style.setProperty('--fit', Math.min(vw / 1536, vh / 1024, 1));
      document.documentElement.dataset.compact = String(vw < 700);
    }
    function placeGirl() {
      scene.style.setProperty('--girl-x', girlPos.x + 'px');
      scene.style.setProperty('--girl-y', girlPos.y + 'px');
    }
    function nearBoy() {
      return Math.hypot(girlPos.x - 790, girlPos.y - 520) < 190;
    }
    function updateInteractionPanel() {
      const shouldHide = !scene.classList.contains('explore') || !nearBoy();
      if (interactPanel.hidden !== shouldHide) interactPanel.hidden = shouldHide;
    }
    function showScene(next) {
      const name = validScenes.has(next) ? next : 'arrival';
      scene.className = 'scene ' + name;
      delete scene.dataset.action;
      history.replaceState(null, '', '?scene=' + name);
      updateInteractionPanel();
    }
    // 前厅对话：一句一句翻，点卡片或“下一句”都能走
    const dialogueLines = [
      '咳咳，测试麦克风……那个，屁屁，看得到吗？这是我花了好几个晚上做出来的，别嫌弃页面简陋。',
      '作为一个低俗的人，我一开始确实是被你的脸吸引的。但后来嘛，我发现那个连干拌面加醋加多了酸得皱眉、大中午才顶着完美丸子头出门、还敢拿长沙话嘲笑我闷葫芦的女生，其实还挺可爱的。',
      '虽然你拍照总是把我拍出双下巴，连我半月板不好你都要凶巴巴地管着我，但我大人有大量，在这个农场里，给你留了块最大的地。',
      '这个世界没有工作的烦恼，没有未来的焦虑。你可以在这里种地、钓鱼、发呆，或者……继续给我拍那些只有我懂的照片。',
      '今天是你生日。去随便逛逛吧，我在阳光下，找到了你.......'
    ];
    let dialogueStep = 0;
    const dialogueLineEl = document.querySelector('#dialogueLine');
    const dialoguePageEl = document.querySelector('#dialoguePage');
    const dialogueNextEl = document.querySelector('#dialogueNext');
    function renderDialogueLine(quiet) {
      dialogueLineEl.textContent = dialogueLines[dialogueStep];
      if (!quiet) {
        dialogueLineEl.classList.remove('line-appear');
        void dialogueLineEl.offsetWidth;
        dialogueLineEl.classList.add('line-appear');
      }
      dialoguePageEl.textContent = `${dialogueStep + 1} / ${dialogueLines.length}`;
      dialogueNextEl.textContent = dialogueStep < dialogueLines.length - 1 ? '下一句 →' : '好呀 →';
    }
    function nextDialogue() {
      if (dialogueStep < dialogueLines.length - 1) {
        dialogueStep += 1;
        renderDialogueLine();
      } else {
        finishDialogue();
      }
    }
    function enterDialogue() {
      if (busy || !scene.classList.contains('arrival')) return;
      walkTarget = null;
      heldKeys.clear();
      dialogueStep = 0;
      renderDialogueLine(true);
      showScene('dialogue');
      // The action art is requested only after the first scene has appeared.
      ensurePairFrames('hug').catch(() => {});
      ensurePairFrames('kiss').catch(() => {});
    }
    function finishDialogue() {
      showScene('explore');
    }
    function moveGirl(now) {
      const delta = Math.min(.05, (now - lastFrame) / 1000);
      lastFrame = now;
      if (!busy && (scene.classList.contains('arrival') || scene.classList.contains('explore'))) {
        let vx = 0, vy = 0;
        for (const key of heldKeys) { vx += directions[key][0]; vy += directions[key][1]; }
        const usingKeys = Boolean(vx || vy);
        if (usingKeys) walkTarget = null;
        else if (walkTarget) { vx = walkTarget.x - girlPos.x; vy = walkTarget.y - girlPos.y; }
        const distance = Math.hypot(vx, vy);
        const moving = usingKeys || distance > 1;
        if (moving) {
          const step = usingKeys ? 360 * delta : Math.min(distance, 360 * delta);
          girlPos.x = clamp(girlPos.x + vx / distance * step, 80, 1200);
          girlPos.y = clamp(girlPos.y + vy / distance * step, 470, 750);
          const row = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 2 : 3) : (vy < 0 ? 1 : 0);
          walkClock += delta;
          girl.style.backgroundPosition = `${Math.floor(walkClock / .15) % 4 * 33.333}% ${row * 25}%`;
          placeGirl();
        } else {
          walkTarget = null;
          if (walkClock) {
            walkClock = 0;
            girl.style.backgroundPosition = '0% 0%';
          }
        }
        if (scene.classList.contains('arrival') && nearBoy()) enterDialogue();
        if (scene.classList.contains('explore')) updateInteractionPanel();
      }
      requestAnimationFrame(moveGirl);
    }
    function drawPair(kind,first,second,blend) {
      actionContext.clearRect(0,0,frameWidth,frameHeight);
      actionContext.globalAlpha = 1-blend;
      actionContext.drawImage(pairFrames[kind][first],0,0);
      if (blend > 0) {
        actionContext.globalAlpha = blend;
        actionContext.drawImage(pairFrames[kind][second],0,0);
      }
      actionContext.globalAlpha = 1;
    }
    async function approachForAction() {
      const startGirl = {...girlPos};
      scene.className = 'scene action-approach';
      girl.style.left = startGirl.x + 'px';
      girl.style.top = startGirl.y + 'px';
      boy.style.left = '790px';
      boy.style.top = '520px';
      await animate(780,(progress,now) => {
        const step = ease(progress);
        girl.style.transform = `translate3d(${(610-startGirl.x)*step}px,${(520-startGirl.y)*step}px,0)`;
        boy.style.transform = `translate3d(${-130*step}px,0,0)`;
        const walkFrame = Math.floor(now/115)%4*33.333;
        girl.style.backgroundPosition = `${walkFrame}% 75%`;
        boy.style.backgroundPosition = `${walkFrame}% 50%`;
      });
      girl.style.left = '610px';
      girl.style.top = '520px';
      boy.style.left = '660px';
      girl.style.transform = '';
      boy.style.transform = '';
      girl.style.backgroundPosition = '0% 0%';
      boy.style.backgroundPosition = '0% 0%';
    }
    async function performContact(kind) {
      drawPair(kind,0,0,0);
      scene.className = 'scene action-pair ' + kind;
      await animate(150,() => {});
      for (let frame=0;frame<3;frame++) {
        await animate(245,progress => drawPair(kind,frame,frame+1,ease(progress)));
      }
      scene.classList.add('action-contact');
      drawPair(kind,3,3,0);
      await animate(880,progress => {
        const sway = Math.sin(progress*Math.PI*2)*.65;
        actionCanvas.style.transform = `translate3d(-50%,${-Math.sin(progress*Math.PI)*2}px,0) rotate(${sway}deg)`;
      });
      scene.classList.remove('action-contact');
      actionCanvas.style.transform = 'translate3d(-50%,0,0)';
      for (let frame=3;frame>0;frame--) {
        await animate(200,progress => drawPair(kind,frame,frame-1,ease(progress)));
      }
    }
    async function releaseAndReturn() {
      scene.className = 'scene action-release';
      await animate(720,(progress,now) => {
        const step = ease(progress);
        girl.style.transform = `translate3d(${20*step}px,0,0)`;
        boy.style.transform = `translate3d(${130*step}px,0,0)`;
        const walkFrame = Math.floor(now/115)%4*33.333;
        girl.style.backgroundPosition = `${walkFrame}% 50%`;
        boy.style.backgroundPosition = `${walkFrame}% 75%`;
      });
      girl.style.left = '630px';
      boy.style.left = '790px';
      girl.style.transform = '';
      boy.style.transform = '';
      girlPos = {x:630,y:520};
      placeGirl();
      showScene('explore');
      girl.style.left = '';
      girl.style.top = '';
      boy.style.left = '';
      boy.style.top = '';
      girl.style.backgroundPosition = '0% 0%';
      boy.style.backgroundPosition = '0% 0%';
    }
    async function playAction(kind) {
      if (busy) return;
      busy = true;
      walkTarget = null;
      interactPanel.hidden = true;
      const framesReady = ensurePairFrames(kind);
      await approachForAction();
      await framesReady;
      await performContact(kind);
      await releaseAndReturn();
      busy = false;
    }
    async function goToRoom() {
      if (busy) return;
      busy = true;
      walkTarget = null;
      interactPanel.hidden = true;
      scene.className = 'scene leaving';
      await pause(1800);
      const fresh = new URLSearchParams(location.search).get('fresh') === '1';
      try {
        sessionStorage.setItem('pipi-from-foyer', '1');
        if (fresh) localStorage.removeItem('pipi-cottage-save-v1');
      } catch (_) {}
      location.href = 'world.html' + (fresh ? '?fresh=1' : '');
    }
    fitScene();
    addEventListener('resize', fitScene);
    const initialScene = new URLSearchParams(location.search).get('scene') || 'arrival';
    if (initialScene !== 'arrival') girlPos = { x:630, y:520 };
    placeGirl();
    showScene(initialScene);
    requestAnimationFrame(moveGirl);
    scene.addEventListener('pointerdown', event => {
      if (busy || !(scene.classList.contains('arrival') || scene.classList.contains('explore'))) return;
      if (event.target.closest('button, a, .dialogue-card, .interact-panel, .music')) return;
      if (event.target.closest('.boy, .boy-cue, .arrival-note')) { walkTarget = { x:630, y:520 }; return; }
      const bounds = scene.getBoundingClientRect();
      const x = (event.clientX - bounds.left) * 1536 / bounds.width;
      const y = (event.clientY - bounds.top) * 1024 / bounds.height;
      walkTarget = { x:clamp(x - 170, 80, 1200), y:clamp(y - 210, 470, 750) };
    });
    musicButton.addEventListener('click', event => {
      event.stopPropagation();
      soundOn ? disableMusic() : enableMusic();
    });
    scene.addEventListener('pointerdown', event => {
      if (!event.target.closest('.music') && !soundOn) enableMusic();
    }, { once:true });
    document.addEventListener('keydown', event => {
      if (directions[event.key] && (scene.classList.contains('arrival') || scene.classList.contains('explore'))) {
        event.preventDefault(); heldKeys.add(event.key);
      }
    });
    document.addEventListener('keyup', event => heldKeys.delete(event.key));
    addEventListener('blur', () => heldKeys.clear());
    function handleSceneClick(event) {
      if (busy) return;
      if (event.target.closest('[data-next-dialogue]')) { nextDialogue(); return; }
      if (event.target.closest('[data-go-room]')) { goToRoom(); return; }
      const target = event.target.closest('[data-scene]');
      if (target) {
        if (target.dataset.scene === 'hug' || target.dataset.scene === 'kiss') playAction(target.dataset.scene);
        else showScene(target.dataset.scene);
        return;
      }
      // 点对话卡任意空白处也能翻到下一句
      if (scene.classList.contains('dialogue') && event.target.closest('.dialogue-card')) {
        nextDialogue();
      }
    }
    scene.addEventListener('click', handleSceneClick);
    document.querySelector('.dialogue-card').addEventListener('click', handleSceneClick);
    document.addEventListener('keydown', event => {
      if (!scene.classList.contains('dialogue') || busy) return;
      if (event.key === 'Enter' || event.key === ' ' || event.key === 'ArrowRight') {
        event.preventDefault();
        nextDialogue();
      }
    });
  </script>
<script src="js/pwa.js"></script>
</body>
