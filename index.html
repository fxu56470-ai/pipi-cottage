<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1f2a">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="屁屁小屋">
<title>屁屁小屋</title>
<link rel="preload" as="image" href="assets/farm-art.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #1d1620;
    font-family: Nunito, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    color: #fff6e6;
    overflow: hidden;
  }
  .bg {
    position: fixed;
    top: -3%;
    left: -3%;
    width: 106%;
    height: 106%;
    display: block;
    object-fit: cover;
    object-position: center;
    filter: saturate(1.06);
    animation: drift 42s ease-in-out infinite alternate;
    will-change: transform;
    pointer-events: none;
    user-select: none;
  }
  @keyframes drift {
    from { transform: scale(1.02) translate3d(-1%, -1%, 0); }
    to { transform: scale(1.09) translate3d(1.5%, 1%, 0); }
  }
  .veil {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: transparent;
    background-image:
      linear-gradient(to right, rgba(23, 14, 22, .92) 0%, rgba(23, 14, 22, .74) 32%, rgba(23, 14, 22, .18) 58%, rgba(23, 14, 22, 0) 76%),
      linear-gradient(to bottom, rgba(18, 12, 20, .2) 0%, rgba(18, 12, 20, 0) 36%, rgba(13, 8, 16, .74) 100%);
    background-repeat: no-repeat;
    background-size: 100% 100%, 100% 100%;
    pointer-events: none;
  }
  main {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
    align-items: center;
    padding: clamp(24px, 6vw, 84px);
    gap: 40px;
  }
  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: .34em;
    color: #e8c9a8;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .kicker::before { content: ""; width: 34px; height: 1px; background: #e8c9a8aa; }
  h1 {
    margin: 0;
    font-size: clamp(52px, 8.4vw, 112px);
    line-height: .96;
    letter-spacing: .04em;
    font-weight: 900;
    color: #fff8e8;
    text-shadow: 0 6px 0 #7c4a3f, 0 12px 40px #2a1219cc, 0 0 70px #ffbf7a33;
  }
  h1 small {
    display: block;
    font-size: clamp(13px, 1.5vw, 17px);
    letter-spacing: .5em;
    font-weight: 700;
    color: #e9c9a5;
    margin-top: 16px;
    text-shadow: 0 2px 10px #2a1219;
  }
  .lede {
    max-width: 30em;
    margin: 26px 0 0;
    font-size: clamp(14px, 1.45vw, 17px);
    line-height: 1.95;
    color: #eadbd0;
    text-shadow: 0 2px 12px #1a0f14;
  }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .tags span {
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid #ffdcae55;
    background: #2a1c25aa;
    font-size: 12px;
    color: #f3d9bf;
    letter-spacing: .08em;
    backdrop-filter: blur(3px);
  }
  .actions { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 30px;
    border-radius: 999px;
    border: 0;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .06em;
    cursor: pointer;
    text-decoration: none;
    color: #fff8ea;
    background: linear-gradient(#c07d7f, #9d5f6c);
    box-shadow: 0 6px 0 #6e3f4c, 0 18px 40px #180d13aa;
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #6e3f4c, 0 22px 46px #180d13bb; }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #6e3f4c; }
  .btn.ghost {
    background: #2c1f28b8;
    border: 1px solid #f0cf9c88;
    box-shadow: 0 6px 0 #1a121a88;
    color: #ffeacf;
  }
  .btn.ghost:hover { background: #3d2b36d8; }
  .btn.ghost:active { box-shadow: 0 3px 0 #1a121a88; }
  .hint { margin-top: 18px; font-size: 12px; color: #b99d9c; letter-spacing: .04em; }

  .side { justify-self: end; align-self: end; text-align: right; display: grid; gap: 14px; }
  .save-card {
    padding: 16px 20px;
    border-radius: 16px;
    border: 1px solid #f0cf9c55;
    background: #201820bb;
    backdrop-filter: blur(6px);
    font-size: 12px;
    line-height: 1.9;
    color: #e3cbbd;
    min-width: 200px;
  }
  .save-card b { color: #ffeacd; font-size: 14px; display: block; margin-bottom: 4px; }
  .sound {
    justify-self: end;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid #f0cf9c66;
    background: #20182099;
    color: #ffeacd;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .sound:hover { background: #3a2a34cc; }
  .foot {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 14px clamp(24px, 6vw, 84px);
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 11px;
    color: #a98e93;
    letter-spacing: .1em;
    pointer-events: none;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; align-content: center; gap: 22px; padding: 26px 22px 70px; }
    h1 { font-size: clamp(46px, 15vw, 76px); }
    .lede { font-size: 13.5px; line-height: 1.85; margin-top: 18px; }
    .tags { margin-top: 16px; }
    .actions { margin-top: 24px; }
    .btn { padding: 13px 22px; font-size: 14px; }
    .side { justify-self: start; align-self: start; text-align: left; }
    .save-card { min-width: 0; width: 100%; }
    .foot { font-size: 10px; padding: 10px 18px; }
  }
</style>
</head>
<body>
  <img class="bg" src="assets/farm-art.webp" alt="" aria-hidden="true" draggable="false">
  <div class="veil" aria-hidden="true"></div>

  <main>
    <div class="intro">
      <span class="kicker">Pipi's Cottage</span>
      <h1>屁屁小屋<small>一间小屋 · 一块地 · 一片湖 · 楼上一盏灯</small></h1>
      <p class="lede">这个世界没有工作的烦恼，没有未来的焦虑。<br>你可以在这里种地、钓鱼、发呆，或者继续拍那些只有他懂的照片。</p>
      <div class="tags"><span>种地</span><span>钓鱼</span><span>发呆</span><span>看电视</span><span>泡澡</span><span>看星星</span></div>
      <div class="actions">
        <a class="btn" id="startBtn" href="story.html">进屋去 →</a>
        <button class="btn ghost" id="continueBtn" type="button" hidden>继续上次</button>
        <a class="btn ghost" id="storyBtn" href="story.html" hidden>重看序章</a>
      </div>
      <p class="hint" id="hint">第一次来，先听他啰嗦几句。</p>
    </div>

    <div class="side">
      <button class="sound" id="soundBtn" type="button" aria-label="背景音乐" aria-pressed="false">♪</button>
      <div class="save-card" id="saveCard" hidden></div>
    </div>
  </main>

  <footer class="foot">
    <span>给屁屁 · 2026</span>
    <span>不赶时间 · 想做什么就做什么</span>
  </footer>

  <script src="js/core.js"></script>
  <script>
    const save = P.load();
    const startBtn = document.getElementById('startBtn');
    const contBtn = document.getElementById('continueBtn');
    const storyBtn = document.getElementById('storyBtn');
    const saveCard = document.getElementById('saveCard');
    const hint = document.getElementById('hint');

    if (save) {
      const grown = Object.values(save.grown || {}).reduce((a, b) => a + b, 0);
      const fish = Object.values(save.caught || {}).reduce((a, b) => a + b, 0);
      saveCard.hidden = false;
      saveCard.innerHTML = `<b>第 ${save.day} 天 · ${P.PHASES[save.phase]}</b>
        金币 ${save.coins} · 收成 ${grown} 次 · 钓鱼 ${fish} 次<br>
        ${save.flags.ending ? '生日已经过完了，小屋还亮着灯。' : '还有事没做完，回屋看看吧。'}`;
      contBtn.hidden = false;
      storyBtn.hidden = false;
      startBtn.textContent = '重新开始';
      startBtn.href = 'story.html?fresh=1';
      startBtn.classList.remove('btn');
      startBtn.classList.add('btn', 'ghost');
      contBtn.classList.remove('ghost');
      contBtn.style.order = '-1';
      hint.textContent = '继续上次会接着上次的进度；重新开始会清掉存档。';
    }

    contBtn.addEventListener('click', () => { location.href = 'world.html'; });

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      P.audio.toggle();
      soundBtn.textContent = P.audio.on ? '♫' : '♪';
      soundBtn.setAttribute('aria-pressed', String(P.audio.on));
    });
    document.addEventListener('pointerdown', (event) => {
      if (event.target.closest('#soundBtn')) return;
      if (!P.audio.on) { P.audio.start(); soundBtn.textContent = '♫'; }
    }, { once: true });
  </script>
<script src="js/pwa.js"></script>
</body>
</html>
